name: Build Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Safety net: only runs while the Gradle wrapper has not been committed to the repo.
      # Delete this step (and the next one's dependency on it) once gradlew is in git.
      - name: Generate Gradle wrapper (only if missing)
        if: ${{ hashFiles('gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create wrapper files (only if missing)
        if: ${{ hashFiles('gradlew') == '' }}
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: namoz-vaqti-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
